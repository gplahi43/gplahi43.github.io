<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Play Gift Cards</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  :root {
    --gold: #f5c542;
    --gold-2: #d4a017;
    --emerald: #00e5a0;
    --cyan: #00d4ff;
    --deep: #070b14;
    --panel: rgba(255, 255, 255, 0.045);
    --border: rgba(255, 255, 255, 0.09);
  }

  html { scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    background: var(--deep);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 80px;
    color: #e9eef5;
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient glowing orbs */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
    pointer-events: none;
  }

  body::before {
    width: 520px;
    height: 520px;
    top: -180px;
    left: -160px;
    background: radial-gradient(circle, rgba(0, 212, 255, 0.22), transparent 70%);
  }

  body::after {
    width: 560px;
    height: 560px;
    bottom: -220px;
    right: -180px;
    background: radial-gradient(circle, rgba(0, 229, 160, 0.18), transparent 70%);
  }

  body > * { position: relative; z-index: 1; }

  /* Header */
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .brand-triangle {
    width: 0;
    height: 0;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-left: 22px solid var(--emerald);
    filter: drop-shadow(0 0 10px rgba(0, 229, 160, 0.7));
  }

  .brand span {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #a9b6c8;
  }

  h1 {
    font-size: 2.2rem;
    font-weight: 800;
    text-align: center;
    letter-spacing: -0.5px;
    background: linear-gradient(100deg, #ffffff 20%, var(--gold) 55%, var(--emerald) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }

  .subtitle {
    color: #8593a8;
    margin-bottom: 28px;
    font-size: 0.92rem;
    text-align: center;
    letter-spacing: 0.3px;
  }

  /* Stats pill */
  .stats-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 42px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 10px 20px;
    backdrop-filter: blur(14px);
    font-size: 0.82rem;
    color: #a9b6c8;
  }

  .stats-bar span { display: flex; align-items: center; gap: 6px; }

  .stats-bar b { color: var(--emerald); font-weight: 700; }

  .dot-live {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--emerald);
    box-shadow: 0 0 10px var(--emerald);
    animation: blink 1.6s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* Cards */
  .cards {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 760px;
  }

  .card-item {
    flex: 1 1 280px;
    max-width: 320px;
    border-radius: 24px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
    border: 1px solid var(--border);
    backdrop-filter: blur(18px);
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.3, 1),
                box-shadow 0.35s ease,
                border-color 0.35s ease;
  }

  .card-item::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 24px;
    padding: 1px;
    background: linear-gradient(140deg, rgba(255,255,255,0.28), transparent 40%, transparent 60%, rgba(0,229,160,0.35));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0.7;
  }

  .card-item:hover {
    transform: translateY(-10px) scale(1.015);
    box-shadow:
      0 34px 80px rgba(0, 0, 0, 0.7),
      0 0 40px rgba(0, 212, 255, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.16);
    border-color: rgba(0, 212, 255, 0.45);
  }

  .card-item.selected {
    border-color: rgba(0, 229, 160, 0.85);
    box-shadow:
      0 30px 70px rgba(0, 0, 0, 0.65),
      0 0 0 2px rgba(0, 229, 160, 0.45),
      0 0 50px rgba(0, 229, 160, 0.35);
  }

  .card-top {
    padding: 24px 22px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }

  .play-logo {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #fff;
    font-weight: 600;
    font-size: 0.92rem;
    letter-spacing: 0.4px;
  }

  .play-triangle {
    width: 0;
    height: 0;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 17px solid var(--emerald);
    filter: drop-shadow(0 0 8px rgba(0, 229, 160, 0.8));
  }

  .chip {
    width: 34px;
    height: 24px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    opacity: 0.85;
    box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.35);
    position: relative;
  }

  .chip::before {
    content: "";
    position: absolute;
    inset: 6px 4px;
    border: 1px solid rgba(0, 0, 0, 0.28);
    border-radius: 3px;
  }

  .card-body {
    padding: 26px 22px 30px;
    text-align: center;
  }

  .amount {
    font-size: 3.2rem;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    background: linear-gradient(180deg, #ffffff, var(--gold) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 18px rgba(245, 197, 66, 0.35));
  }

  .amount span {
    font-size: 1.7rem;
    vertical-align: top;
    -webkit-text-fill-color: var(--gold);
  }

  .label {
    margin-top: 12px;
    color: #8593a8;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 3.5px;
    text-transform: uppercase;
  }

  .card-shine {
    position: absolute;
    top: 0;
    left: -80%;
    width: 55%;
    height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.16), transparent);
    transform: skewX(-18deg);
    pointer-events: none;
  }

  .card-item:hover .card-shine { animation: shine 1.1s ease; }

  @keyframes shine {
    0% { left: -80%; }
    100% { left: 140%; }
  }

  /* Action area */
  .preview-line {
    margin-top: 44px;
    font-size: 0.95rem;
    color: #8593a8;
    letter-spacing: 0.3px;
  }

  .preview-line b {
    color: var(--gold);
    font-size: 1.3rem;
    margin-left: 6px;
  }

  .get-now {
    margin-top: 22px;
    padding: 17px 70px;
    font-size: 1.02rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #04120c;
    background: linear-gradient(100deg, var(--emerald), #6ef7c9 50%, var(--cyan));
    border: none;
    border-radius: 100px;
    cursor: pointer;
    box-shadow:
      0 12px 34px rgba(0, 229, 160, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
  }

  .get-now:hover {
    transform: translateY(-4px) scale(1.035);
    box-shadow:
      0 18px 48px rgba(0, 229, 160, 0.65),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }

  .get-now:active { transform: scale(0.97); }

  .hidden { display: none !important; }

  /* Generator area */
  .gen-area {
    margin-top: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 540px;
    animation: fadeUp 0.5s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .code-display {
    width: 100%;
    background: linear-gradient(160deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.32));
    border: 1px solid rgba(0, 229, 160, 0.35);
    border-radius: 18px;
    padding: 30px 18px;
    font-family: 'Courier New', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--emerald);
    text-align: center;
    text-shadow: 0 0 18px rgba(0, 229, 160, 0.65);
    word-break: break-all;
    box-shadow:
      0 20px 50px rgba(0, 0, 0, 0.55),
      inset 0 0 40px rgba(0, 229, 160, 0.08);
    backdrop-filter: blur(14px);
  }

  .lock-msg {
    margin-top: 20px;
    display: none;
    color: var(--gold);
    font-size: 0.93rem;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.3px;
  }

  .verify-btn {
    margin-top: 22px;
    padding: 16px 60px;
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #04120c;
    background: linear-gradient(100deg, var(--gold), #ffe89a 50%, var(--gold-2));
    border: none;
    border-radius: 100px;
    cursor: pointer;
    display: none;
    box-shadow:
      0 12px 34px rgba(245, 197, 66, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.65);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
  }

  .verify-btn:hover {
    transform: translateY(-4px) scale(1.035);
    box-shadow:
      0 18px 48px rgba(245, 197, 66, 0.65),
      inset 0 1px 0 rgba(255, 255, 255, 0.75);
  }

  .verify-btn:active { transform: scale(0.97); }

  /* Popup modal */
  .popup-modal {
    position: fixed;
    inset: 0;
    background: rgba(3, 6, 12, 0.78);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 100;
  }

  .popup-modal.active {
    opacity: 1;
    pointer-events: auto;
  }

  .popup-box {
    background: linear-gradient(165deg, #131a26, #0b101a);
    color: #e9eef5;
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 34px 26px 26px;
    width: 100%;
    max-width: 370px;
    text-align: center;
    box-shadow:
      0 40px 100px rgba(0, 0, 0, 0.75),
      0 0 60px rgba(0, 229, 160, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transform: scale(0.88) translateY(10px);
    transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }

  .popup-modal.active .popup-box { transform: scale(1) translateY(0); }

  .popup-icon {
    width: 68px;
    height: 68px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #2df5b4, var(--emerald) 55%, #009e6d);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 10px 30px rgba(0, 229, 160, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }

  .popup-triangle {
    width: 0;
    height: 0;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-left: 22px solid #04120c;
    margin-left: 5px;
  }

  .popup-amount {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff, var(--gold) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 16px rgba(245, 197, 66, 0.3));
  }

  .popup-desc {
    margin-top: 12px;
    color: #8593a8;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .popup-close {
    margin-top: 24px;
    width: 100%;
    padding: 15px 0;
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #04120c;
    background: linear-gradient(100deg, var(--emerald), #6ef7c9 50%, var(--cyan));
    border: none;
    border-radius: 100px;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(0, 229, 160, 0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .popup-close:hover {
    transform: scale(1.03);
    box-shadow: 0 14px 36px rgba(0, 229, 160, 0.55);
  }

  @media (max-width: 480px) {
    h1 { font-size: 1.7rem; }
    .amount { font-size: 2.6rem; }
    .code-display { font-size: 1.25rem; letter-spacing: 2px; }
    .get-now, .verify-btn { padding: 15px 44px; }
  }
</style>
</head>
<body>

  <div class="brand">
    <div class="brand-triangle"></div>
    <span>Google Play</span>
  </div>

  <h1>Premium Gift Cards</h1>
  <p class="subtitle">Choose your gift card and unlock instantly</p>

  <div class="stats-bar">
    <span><i class="dot-live"></i> <b id="user-online">312</b> online now</span>
    <span>·</span>
    <span>Updated: <b id="update">--</b></span>
  </div>

  <div class="cards">
    <!-- $50 Card -->
    <div class="card-item" data-amount="50">
      <div class="card-shine"></div>
      <div class="card-top">
        <div class="play-logo">
          <div class="play-triangle"></div>
          Google Play
        </div>
        <div class="chip"></div>
      </div>
      <div class="card-body">
        <div class="amount"><span>$</span>50</div>
        <div class="label">Gift Card</div>
      </div>
    </div>

    <!-- $100 Card -->
    <div class="card-item" data-amount="100">
      <div class="card-shine"></div>
      <div class="card-top">
        <div class="play-logo">
          <div class="play-triangle"></div>
          Google Play
        </div>
        <div class="chip"></div>
      </div>
      <div class="card-body">
        <div class="amount"><span>$</span>100</div>
        <div class="label">Gift Card</div>
      </div>
    </div>
  </div>

  <!-- Preview + Get Now -->
  <div class="preview-line" id="boxhide">
    Selected: <b id="previewAmount">$50</b>
  </div>

  <button class="get-now" id="getNowBtn">Get Now</button>

  <!-- Generator area -->
  <div class="gen-area hidden" id="genArea">
    <div class="code-display" id="codeDisplay">●●●●-●●●●-●●●●-####</div>
    <div class="lock-msg" id="lockMsg">🔒 Code locked — verification required</div>
    <button class="verify-btn" id="verifyBtn" onclick="window._xb()">Verify Now</button>
  </div>

  <!-- Popup modal -->
  <div class="popup-modal" id="cardPopup">
    <div class="popup-box">
      <div class="popup-icon"><div class="popup-triangle"></div></div>
      <div class="popup-amount" id="popupAmount">$50</div>
      <p class="popup-desc" id="popupDesc">You selected a $50 Google Play gift card.</p>
      <button class="popup-close" id="popupCloseBtn">Continue</button>
    </div>
  </div>

  <script>
    (function() {
      // ---- user online & update ----
      function updateOnline() {
        const el = document.getElementById("user-online");
        if (el) el.innerHTML = Math.floor(Math.random() * 80) + 280;
      }
      setInterval(updateOnline, 7000);
      const d = new Date();
      const updateEl = document.getElementById("update");
      if (updateEl) {
        updateEl.innerHTML = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      }

      // ---- DOM refs ----
      const cardItems = document.querySelectorAll('.card-item');
      const previewAmount = document.getElementById('previewAmount');
      const getNowBtn = document.getElementById('getNowBtn');
      const boxhide = document.getElementById('boxhide');
      const genArea = document.getElementById('genArea');
      const codeDisplay = document.getElementById('codeDisplay');
      const lockMsg = document.getElementById('lockMsg');
      const verifyBtn = document.getElementById('verifyBtn');

      // popup
      const popupModal = document.getElementById('cardPopup');
      const popupAmount = document.getElementById('popupAmount');
      const popupDesc = document.getElementById('popupDesc');
      const popupClose = document.getElementById('popupCloseBtn');

      let selectedAmount = 10;

      // ---- select card ----
      function selectCard(el) {
        cardItems.forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
        const amount = el.getAttribute('data-amount') || '10';
        selectedAmount = parseInt(amount);
        previewAmount.textContent = '$' + amount;
        popupAmount.textContent = '$' + amount;
        popupDesc.textContent = 'You selected a $' + amount + ' Google Play gift card.';
        popupModal.classList.add('active');
        genArea.classList.add('hidden');
        boxhide.classList.remove('hidden');
        getNowBtn.classList.remove('hidden');
      }

      // ---- card click ----
      cardItems.forEach((item) => {
        item.addEventListener('click', function(e) {
          selectCard(this);
        });
      });

      // ---- default select first ----
      if (cardItems.length > 0) {
        const first = cardItems[0];
        first.classList.add('selected');
        const amt = first.getAttribute('data-amount') || '10';
        previewAmount.textContent = '$' + amt;
        selectedAmount = parseInt(amt);
        popupAmount.textContent = '$' + amt;
        popupDesc.textContent = 'You selected a $' + amt + ' Google Play gift card.';
      }

      // ---- popup close ----
      function closePopup() { popupModal.classList.remove('active'); }
      popupClose.addEventListener('click', closePopup);
      popupModal.addEventListener('click', function(e) {
        if (e.target === popupModal) closePopup();
      });

      // ---- redeem / generator ----
      let generatorInterval = null;
      let stopCounter = 0;

      function startGenerator() {
        boxhide.classList.add('hidden');
        getNowBtn.classList.add('hidden');
        genArea.classList.remove('hidden');

        if (generatorInterval) clearInterval(generatorInterval);
        stopCounter = 0;
        const KeyCode = ["9","8","7","6","5","4","3","2","1","0","A","B","C","D","E","F","G","H","I","J","K","L","Z","Y","X","W","V","U","T","S","R","Q","P","O","N","M"];

        function genkey() {
          if (stopCounter >= 100) {
            clearInterval(generatorInterval);
            codeDisplay.innerHTML = '●●●●-●●●●-●●●●-####';
            if (verifyBtn) verifyBtn.style.display = 'inline-block';
            if (lockMsg) lockMsg.style.display = 'block';
            return;
          }
          const parts = [];
          for (let i = 0; i < 4; i++) {
            let seg = '';
            for (let j = 0; j < 4; j++) {
              seg += KeyCode[Math.floor(Math.random() * KeyCode.length)];
            }
            parts.push(seg);
          }
          codeDisplay.innerHTML = parts.join('-');
          stopCounter++;
        }

        genkey();
        generatorInterval = setInterval(genkey, 55);
        if (verifyBtn) verifyBtn.style.display = 'none';
        if (lockMsg) lockMsg.style.display = 'none';
      }

      if (getNowBtn) {
        getNowBtn.addEventListener('click', startGenerator);
      }

      // ---- Verify Now → open link ----
      window._xb = function() {
        window.open('https://appcomplete.org/cl/i/27o5pk', '_blank');
      };
    })();
  </script>

</body>
</html>
